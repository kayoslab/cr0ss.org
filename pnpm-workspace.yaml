allowBuilds:
  bufferutil: false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Security patches for transitive dependencies whose parents still pin vulnerable ranges.
overrides:
  '@vercel/config>zod': ^4.6.7
  '@tailwindcss/typography>postcss-selector-parser': ^6.1.6
  minimatch@10: ^11.0.1
